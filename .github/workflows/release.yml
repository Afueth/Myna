name: Release

# Pushing a tag such as v0.1.0 builds Myna on each platform, plus a Windows
# installer, and publishes them as a GitHub release. Running the workflow by
# hand from the Actions tab builds the same files as a test, without
# publishing anything; download them from the run's Artifacts section.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        shell: bash
        run: |
          version=$(sed -n 's/^project(myna VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CMakeLists.txt version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PKG=myna-v$version-${{ matrix.name }}" >> "$GITHUB_ENV"

      # A static C runtime on Windows, so myna.exe runs without extra DLLs.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          mkdir -p "$PKG/bin"
          exe=$(find build -name 'myna' -type f -perm -u+x -o -name 'myna.exe' -type f | head -n 1)
          cp "$exe" "$PKG/bin/"
          cp -r data "$PKG/"
          cp README.md LICENSE "$PKG/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            mkdir -p "$PKG/assets" "$PKG/scripts"
            cp assets/myna.ico "$PKG/assets/"
            cp scripts/install-shortcut.ps1 "$PKG/scripts/"
          fi

      # Run the packaged program from outside its folder, as a user would.
      - name: Smoke test
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$PKG/bin/myna" search "close the popup when I click outside"

      - name: Archive
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$PKG.zip" "$PKG"
          else
            tar -czf "$PKG.tar.gz" "$PKG"
          fi

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$env:GITHUB_WORKSPACE\$env:PKG" "/O$env:GITHUB_WORKSPACE" installer\myna.iss

      # Install silently, run myna through PATH from a new shell, uninstall.
      - name: Test the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\MynaInstall"
          Start-Process ".\Myna-Setup-$env:VERSION.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', "/DIR=$dir", '/TASKS=addtopath'
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -notlike "*$dir\bin*") { throw "Installer did not add $dir\bin to PATH" }
          cmd /c "set PATH=$dir\bin;%PATH% && cd /d %TEMP% && myna search close the popup when I click outside"
          if ($LASTEXITCODE -ne 0) { throw "myna failed when started from PATH" }
          Start-Process "$dir\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -like "*$dir\bin*") { throw "Uninstaller did not remove Myna from PATH" }
          if (Test-Path "$dir\bin\myna.exe") { throw "Uninstaller left myna.exe behind" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: |
            ${{ env.PKG }}.*
            Myna-Setup-*.exe

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Myna $GITHUB_REF_NAME" \
            --generate-notes
